name: Render audio

on:
  push:
    paths:
      - tools/render_binaural.py
      - .github/workflows/render-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Render sessions
        run: |
          python tools/render_binaural.py --mode sleep --minutes 30 --out binaural-sleep-30min.wav
          python tools/render_binaural.py --mode focus --minutes 25 --out binaural-focus-25min.wav
      - name: Publish as release assets
        run: |
          gh release create sessions binaural-sleep-30min.wav binaural-focus-25min.wav \
            --title "Binaural sessions (WAV)" \
            --notes "Pre-rendered binaural sessions. Sleep: 136 Hz carrier, beat 10 -> 6 -> 4 -> 2.5 Hz, 30 min. Focus: 200 Hz carrier, beat 10 -> 14 -> 18 -> 16 Hz, 25 min. Stereo WAV, use headphones. Play on the lock screen in any audio app." \
            --latest || \
          gh release upload sessions binaural-sleep-30min.wav binaural-focus-25min.wav --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
